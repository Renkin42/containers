api:
  dashboard: true
  insecure: true

log:
  level: DEBUG

entryPoints:
  websecure:
    address: ":443"
    asDefault: true
    http:
      tls:
        certResolver: cloudflare
        domains:
          - main: "home.renkin42.dev"
            sans:
              - "*.home.renkin42.dev"
          - main: "wedomad.science"
            sans:
              - "*.wedomad.science"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    network: proxy
    exposedByDefault: false

certificatesResolvers:
  cloudflare:
    acme:
      email: arleydecker@renkin42.net
      storage: /letsencrypt/acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"
