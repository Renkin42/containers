api:
  dashboard: true
  insecure: true

log:
  level: DEBUG

entryPoints:
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: cloudflare
        domains:
          - main: "local.renkin42.dev"
            sans:
              - "*.local.renkin42.dev"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false

certificatesResolvers:
  coudflare:
    acme:
      email: arleydecker@renkin42.net
      storage: /letsecrypt/acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"
